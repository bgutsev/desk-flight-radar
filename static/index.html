<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plane Radar</title>
    <link rel="stylesheet" href="/style.css" />
    <!-- config.js must load before radar.js (defer preserves order). -->
    <script src="/config.js" defer></script>
    <script src="/radar.js" defer></script>
  </head>
  <body>
    <!-- Notification permission modal — shown on every page load -->
    <div id="alert-modal" class="modal-overlay">
      <div class="modal">
        <div class="modal-scanlines"></div>
        <div class="modal-header">
          <span class="modal-header-line"></span>
          <span class="modal-title">&#9670;&nbsp;RADAR ALERTS&nbsp;&#9670;</span>
          <span class="modal-header-line"></span>
        </div>
        <p class="modal-body">Enable <strong>sound notifications</strong> for<br>landing and taking-off aircraft?</p>
        <div class="modal-buttons">
          <button id="modal-enable" class="modal-btn modal-btn-yes">YES</button>
          <button id="modal-dismiss" class="modal-btn modal-btn-no">NO</button>
        </div>
      </div>
    </div>

    <main>
      <!-- LEFT: radar device with PPI canvas overlaid on the round screen -->
      <section class="radar-side">
        <div class="radar-stage">
          <img src="/radar-frame.png?v=2" alt="Radar console" />
          <canvas id="ppi"></canvas>
        </div>
      </section>

      <!-- RIGHT: controls + notifications + aircraft cards -->
      <section class="panel">
        <div class="panel-header">
          <h1>PLANE RADAR</h1>
          <!-- Blinks red with a message on a failed/empty fetch; dim otherwise. -->
          <div id="data-status" title="Data link status">
            <span class="dot"></span>
            <span class="msg" id="data-status-msg"></span>
          </div>
        </div>

        <form id="controls" class="controls" autocomplete="off">
          <label>
            Lat
            <input id="lat" class="coord" type="number" step="any" min="-90" max="90" value="42.6967" />
          </label>
          <label>
            Lon
            <input id="lon" class="coord" type="number" step="any" min="-180" max="180" value="23.4114" />
          </label>
          <label>
            Radius (km)
            <input id="radius" type="number" step="1" min="1" max="500" value="25" />
          </label>
          <button type="submit" id="update-btn">Update</button>

          <!-- Optional static reference point plotted on the radar. Aligned
               directly under the main coordinates; the diamond matches the
               radar marker. -->
          <label class="ref">
            &#9670; Ref Lat
            <input id="mark-lat" class="coord" type="number" step="any" min="-90" max="90" placeholder="—" />
          </label>
          <label class="ref">
            &#9670; Ref Lon
            <input id="mark-lon" class="coord" type="number" step="any" min="-180" max="180" placeholder="—" />
          </label>
          <button type="button" id="mark-clear" title="Clear reference marker">&#10005;</button>

          <div class="mock-switch">
            <div class="switch-group">
              <span class="switch-label" id="mock-label">LIVE</span>
              <button
                type="button"
                id="mock-toggle"
                class="switch"
                role="switch"
                aria-checked="false"
                title="Toggle live / mock data"
              >
                <span class="knob"></span>
              </button>
            </div>
            <div class="switch-group sound-group">
              <span class="switch-label" id="sound-label">ALERTS</span><span id="sound-icon" class="sound-icon"></span>
              <button
                type="button"
                id="sound-toggle"
                class="switch sound-on"
                role="switch"
                aria-checked="true"
                title="Toggle notification sound (visual alerts stay on)"
              >
                <span class="knob"></span>
              </button>
            </div>
          </div>
        </form>

        <div class="status">
          <span id="status-line">Initializing&hellip;</span>
        </div>

        <div id="cards" class="cards"></div>
      </section>
    </main>
  </body>
</html>
